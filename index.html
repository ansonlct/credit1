<meta name="application-name" content="W!bate">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="W!bate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="msapplication-TileColor" content="#5b47f5">

<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">

<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167x167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152x152.png">

<body>
<!-- Core layout stays in this file. Styles: assets/css/. App logic: assets/js/app.js. -->

<div id="mainApp" class="app">
  <div class="top">
    <a class="title brand-link" href="about.html" aria-label="關於 W!bate">W!bate</a>
    <div class="top-actions">
      <input id="monthPicker" class="month" type="month">
      <button id="settingsBtn" class="new-target-btn" aria-label="新增目標">＋ 新增優惠</button>
    </div>
  </div>

  <div class="section-head goal-section-head">
    <h2 id="goalSectionTitle">進行中的回贈目標 ( 0 個 )</h2>
    <div class="goal-head-tools">
      <label class="goal-sort-control" aria-label="回贈目標排序">
        <span class="goal-sort-label">排序</span>
        <select id="goalSortSelect">
          <option value="card">依信用卡名稱</option>
          <option value="type">依簽賬類型</option>
          <option value="end">依結束時間</option>
          <option value="added">依加入時間</option>
          <option value="progress">依達標比例</option>
        </select>
      </label>
      <button id="goalSortDir" class="goal-sort-dir" type="button" aria-label="切換排序方向" title="切換排序方向">↑</button>
    </div>
  </div>
  <div id="goals" class="goals"></div>

  <div class="section-head history-head">
    <h2>消費紀錄</h2>
    <div class="history-head-actions"><span id="txCount">0 筆</span><button id="viewMoreTx" class="history-more" type="button">查看更多</button></div>
  </div>
  <div id="txList" class="tx-list"></div>
</div>

<div id="transactionPage" class="app transaction-page hidden">
  <div class="transaction-page-top">
    <button id="historyBack" class="transaction-page-back" type="button" aria-label="返回主頁">‹</button>
    <div class="transaction-page-title">消費紀錄</div>
    <input id="historyMonthPicker" class="transaction-page-month" type="month" aria-label="選擇月份">
  </div>
  <div class="transaction-summary"><span id="historyTxCount">0 筆</span><span>本月總簽賬 <b id="historyTxTotal">$0</b></span></div>
  <div id="historyTxList" class="tx-list"></div>
</div>

<div id="bottomBar" class="bottom">
  <button id="openAdd" class="add-btn">＋ 新增消費</button>
</div>

<div id="addModal" class="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="addModalTitle">新增消費</h3>
      <button class="close" data-close="addModal">×</button>
    </div>

    
    <div class="field tx-card-carousel-field">
      <label>信用卡</label>
      <div id="txCardCarousel" class="tx-card-carousel" aria-label="信用卡選擇，可左右掃動"></div>
      <input id="txCard" type="hidden" value="">
      <div id="txCardSelectedLabel" class="tx-card-selected-label"></div>
    </div>

    <div class="amount-entry" id="amountEntry">
      <div class="amount-caption">消費金額</div>
      <div class="amount-line">
        <span class="amount-currency">HK$</span>
        <input id="txAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="消費金額">
      </div>
    </div>

    <div class="field">
      <label>簽賬類別</label>
      <select id="txCategory"></select>
    </div>

    <div class="target-label">命中目標</div>
    <div id="txTargetPicks" class="target-picks multi-target-picks"></div>
    <div id="txTargetSummary" class="tx-target-summary"></div>

    <button id="confirmAdd" class="confirm">新增消費</button>
    <button id="deleteTx" class="tx-delete-action hidden" type="button">刪除消費</button>
  </div>
</div>

<div id="settingsModal" class="modal">

  </div>
</div>


<div id="appNotice" class="app-notice" role="status" aria-live="polite"></div>
